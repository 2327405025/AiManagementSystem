services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: task_app
      POSTGRES_PASSWORD: task_app
    volumes:
      - task_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_app -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.23
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/tasks?options=-c%20statement_timeout=5000%20-c%20idle_in_transaction_session_timeout=10000
      DB_USERNAME: task_app
      DB_PASSWORD: task_app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CACHE_REDIS_ENABLED: "true"
      REDIS_HOST: redis
      CHROMA_ENABLED: "true"
      CHROMA_URL: http://chroma:8000/api/v1
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  task_data:
  redis_data:
  chroma_data:
